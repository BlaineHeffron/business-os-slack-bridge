# Create the Slack app from this manifest: https://api.slack.com/apps → Create New App → From a manifest.
# After creating: enable Socket Mode, generate an app-level token (connections:write)
# for SLACK_APP_TOKEN, install to the workspace for SLACK_BOT_TOKEN.
display_information:
  name: BusinessOS Social Approvals
  description: Review, edit, and approve social posts before they go to Buffer.
  background_color: "#1a2b4c"
features:
  bot_user:
    display_name: social-approvals
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
